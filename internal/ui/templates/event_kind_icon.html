<svg class="trace-kind-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 1.2 9.5 6h4.3L11 9l1.4 4.8L8 11.2 3.6 13.8 5 9 2.2 6h4.3z"/></svg>

{{- else if eq . "mcp" -}}
<svg class="trace-kind-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M2 3h5v5H2zm7 0h5v5H9zM2 10h5v3H2zm7 0h5v3H9z"/></svg>
